# Локальные БД для разработки и тестов (только локально, пароли не секретные).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nasvyazi
      POSTGRES_PASSWORD: nasvyazi
      POSTGRES_DB: nasvyazi
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nasvyazi -d nasvyazi"]
      interval: 2s
      timeout: 3s
      retries: 20

  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nasvyazi
      POSTGRES_PASSWORD: nasvyazi
      POSTGRES_DB: nasvyazi_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nasvyazi -d nasvyazi_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
